name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DGLINA_BUILD_APP=ON -DGLINA_BUILD_PLUGIN=ON
      - name: Build
        run: cmake --build build --config Release --target glina_tests glina GlinaApp GlinaPlugin_VST3 --parallel
      - name: Engine tests
        run: build\Release\glina_tests.exe
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item build\app\GlinaApp_artefacts\Release\Glina.exe out\
          Copy-Item -Recurse build\plugin\GlinaPlugin_artefacts\Release\VST3\Glina.vst3 out\
          Copy-Item build\Release\glina.exe out\glina-cli.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Glina-windows-x64
          path: out

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libgl1-mesa-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLINA_BUILD_APP=ON -DGLINA_BUILD_PLUGIN=ON
          cmake --build build --target glina_tests glina GlinaApp GlinaPlugin_VST3
      - name: Engine tests
        run: build/glina_tests
