name: build

on:
  push:
    branches: ['**']
    tags: ['v*']          # pushing a tag like v0.2.0 also publishes a GitHub Release
    paths-ignore: ['**.md']
  # GitHub → Actions → build → "Run workflow": enter a version (e.g. 0.2.0) to publish a release.
  workflow_dispatch:
    inputs:
      release:
        description: 'Версия релиза, например 0.2.0 (пусто — просто сборка)'
        required: false
        default: ''

# A newer push to the same branch cancels the build in progress.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Test branch: builds only the GlinaProbe test plugin (GLINA_HOST_PROBE, see plugin/CMakeLists.txt).
      - name: Configure
        run: cmake -S . -B build -A x64 -DGLINA_BUILD_PLUGIN=ON -DGLINA_HOST_PROBE=ON
      - name: Build
        run: cmake --build build --config Release --target glina_tests GlinaPlugin_VST3 --parallel
      - name: Engine tests
        run: build\Release\glina_tests.exe
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item -Recurse build\plugin\GlinaPlugin_artefacts\Release\VST3\GlinaProbe.vst3 out\
      - uses: actions/upload-artifact@v4
        with:
          name: GlinaProbe-windows-x64
          path: out

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libxi-dev \
            libegl-dev libglu1-mesa-dev mesa-common-dev
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGLINA_BUILD_APP=ON -DGLINA_BUILD_PLUGIN=ON
          cmake --build build --target glina_tests glina GlinaApp GlinaPlugin_VST3
      - name: Engine tests
        run: build/glina_tests

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Glina-windows-x64
          path: Glina
      - name: Version
        env:
          INPUT_VER: ${{ inputs.release }}
        run: |
          VER="${INPUT_VER:-$GITHUB_REF_NAME}"
          VER="${VER#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
      - name: Package
        run: |
          (cd Glina && zip -qr "../Glina-${VER}-windows-x64.zip" .)
          cp Glina/Glina.exe "Glina-${VER}-standalone.exe"
          ls -la
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VER}" --target "$GITHUB_SHA" \
            "Glina-${VER}-windows-x64.zip" "Glina-${VER}-standalone.exe" \
            --title "Glina ${VER}" --notes-file .github/release-notes-ru.md
